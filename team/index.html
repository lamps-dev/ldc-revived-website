<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDC Revived Call Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    text-align: center;
    background: #808080
  }
  .yt-container {
  background: #6c6c6c;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #c6c6c6;
  border-radius: 10px;
  width: 300px;
  height: 150px
  }
  .label {
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .yt-subscribe-btn {
    background-color: #f1f1f1;
    color: #0f0f0f;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 20px;
    margin-left: 24px;
    transition: background-color 0.2s ease;
  }
  .footer-links {
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
    color: #000;
  }
  .yt-subscribe-btn:hover {
    background-color: #d9d9d9;
  }
  #timer {
    display: block;
    margin: 0.4em 0 0.3em;
    font-size: clamp(1.8rem, 7vw, 4.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    line-height: 1.1;
  }

  #tz {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 400;
    opacity: 0.65;
  }
  main {
  background: #000;
  color: #fff;
  }
  div {
  width: 100%;
  }
  .seperator {
  width: 100%;
  background:
    linear-gradient(135deg, #000000 25%, transparent 25%) -100px 0,
    linear-gradient(225deg, #000000 25%, transparent 25%) -100px 0,
    linear-gradient(315deg, #808080 25%, transparent 25%),
    linear-gradient(45deg, #808080 25%, transparent 25%);
  background-size:
    200px 200px;
  height: 200px;
  background-color: #000000;
}
</style>
</head>
<body>
  <div>
    <main>
      <div style="padding: 50px 0;"></div>
      <p class="label">LDC Revived Discord Call has been running for:</p>
      <span id="timer" data-start="1785951000">—</span>
      <p id="tz">Loading...</p>
    </main>
    <div style="padding: 300px 0; background: #000;"></div>
    <div class="seperator"></div>
    <div style="padding: 300px 0;"></div>
    <div style="padding: 30px 0;"></div>
      <div style="display: flex;align-items: center;justify-content: center;">
        <div class="yt-container">
          <a href="https://youtube.com/@longestdiscordcall-revived"><img src="https://yt3.googleusercontent.com/whPQMFkeOb3OR7sGpIqJYZounG8zBkkU1LHViUZ1_Kqou8FuEuS6Mq9ftqRx0mmOCJn1EBnLcQ=s160-c-k-c0x00ffffff-no-rj" alt="Channel Profile Picture" width="100" height="100" style="border-radius: 50%"></a>
          <a class="yt-subscribe-btn" href="https://youtube.com/@longestdiscordcall-revived?sub_confirmation=1" target="_blank">Subscribe</a>
        </div>
      </div>
      <div style="padding: 30px 0;"></div>
      <a class="footer-links" href="/team">The Team</a> | <a class="footer-links" href="https://youtube.com/@longestdiscordcall-revived">YT</a>
      <div style="padding: 30px 0;"></div>
    </div>
  </div>
<script>
  const el    = document.getElementById("timer");
  const tzEl  = document.getElementById("tz");
  const start = new Date(Number(el.dataset.start) * 1000);
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  tzEl.textContent = "Your timezone: " + tz;

  function fmt(from, to) {
    const cursor = new Date(from);

    let years = to.getFullYear() - cursor.getFullYear();
    cursor.setFullYear(cursor.getFullYear() + years);
    if (cursor > to) { years--; cursor.setFullYear(cursor.getFullYear() - 1); }

    let months = to.getMonth() - cursor.getMonth();
    if (months < 0) months += 12;
    cursor.setMonth(cursor.getMonth() + months);
    if (cursor > to) { months--; cursor.setMonth(cursor.getMonth() - 1); }

    let rem = to - cursor;
    const weeks = Math.floor(rem / 604800000); rem -= weeks * 604800000;
    const days  = Math.floor(rem / 86400000);  rem -= days  * 86400000;
    const hours = Math.floor(rem / 3600000);   rem -= hours * 3600000;
    const mins  = Math.floor(rem / 60000);     rem -= mins  * 60000;
    const secs  = Math.floor(rem / 1000);

    const units = [
      [years, "y"], [months, "mo"], [weeks, "w"],
      [days, "d"], [hours, "h"], [mins, "m"], [secs, "s"],
    ];

    const first = units.findIndex(([v]) => v > 0);
    const kept  = first === -1 ? [[0, "s"]] : units.slice(first);
    return kept.map(([v, u]) => v + u).join(" ");
  }

  function tick() {
    const now = new Date();
    el.textContent = now < start ? "Not started yet" : fmt(start, now);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
