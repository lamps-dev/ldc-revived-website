<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDC Revived Call Timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }

  .label {
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  #timer {
    display: block;
    margin: 0.4em 0 0.3em;
    font-size: clamp(1.8rem, 7vw, 4.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    line-height: 1.1;
  }

  #tz {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 400;
    opacity: 0.65;
  }
</style>
</head>
<body>

  <main>
    <p class="label">LDC Revived Discord Call has been running for:</p>
    <span id="timer" data-start="1785951000">—</span>
    <p id="tz"></p>
  </main>

<script>
  const el    = document.getElementById("timer");
  const tzEl  = document.getElementById("tz");
  const start = new Date(Number(el.dataset.start) * 1000);
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  tzEl.textContent = tz;

  function fmt(from, to) {
    const cursor = new Date(from);

    let years = to.getFullYear() - cursor.getFullYear();
    cursor.setFullYear(cursor.getFullYear() + years);
    if (cursor > to) { years--; cursor.setFullYear(cursor.getFullYear() - 1); }

    let months = to.getMonth() - cursor.getMonth();
    if (months < 0) months += 12;
    cursor.setMonth(cursor.getMonth() + months);
    if (cursor > to) { months--; cursor.setMonth(cursor.getMonth() - 1); }

    let rem = to - cursor;
    const weeks = Math.floor(rem / 604800000); rem -= weeks * 604800000;
    const days  = Math.floor(rem / 86400000);  rem -= days  * 86400000;
    const hours = Math.floor(rem / 3600000);   rem -= hours * 3600000;
    const mins  = Math.floor(rem / 60000);     rem -= mins  * 60000;
    const secs  = Math.floor(rem / 1000);

    const units = [
      [years, "y"], [months, "mo"], [weeks, "w"],
      [days, "d"], [hours, "h"], [mins, "m"], [secs, "s"],
    ];

    const first = units.findIndex(([v]) => v > 0);
    const kept  = first === -1 ? [[0, "s"]] : units.slice(first);
    return kept.map(([v, u]) => v + u).join(" ");
  }

  function tick() {
    const now = new Date();
    el.textContent = now < start ? "Not started yet" : fmt(start, now);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
